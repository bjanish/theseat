<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geometric Cat</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { overflow: hidden; background: #0a0a0a; }
        canvas { display: block; }
    </style>
</head>
<body>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0a0a0a);

        const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 2, 6);
        camera.lookAt(0, 1.2, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        document.body.appendChild(renderer.domElement);

        // Materials
        const bodyMat = new THREE.MeshPhongMaterial({ color: 0x444444, flatShading: true });
        const accentMat = new THREE.MeshPhongMaterial({ color: 0xd4a84b, flatShading: true });
        const eyeMat = new THREE.MeshPhongMaterial({ color: 0x44ff88, emissive: 0x22aa44, flatShading: true });
        const noseMat = new THREE.MeshPhongMaterial({ color: 0xff6688, flatShading: true });
        const wireMat = new THREE.MeshBasicMaterial({ color: 0xd4a84b, wireframe: true, transparent: true, opacity: 0.15 });

        const cat = new THREE.Group();

        // Body - icosahedron stretched
        const bodyGeo = new THREE.IcosahedronGeometry(1.0, 1);
        bodyGeo.scale(0.8, 1.0, 0.6);
        const body = new THREE.Mesh(bodyGeo, bodyMat);
        body.position.y = 1.0;
        cat.add(body);

        // Wireframe overlay on body
        const bodyWire = new THREE.Mesh(bodyGeo.clone(), wireMat);
        bodyWire.position.copy(body.position);
        cat.add(bodyWire);

        // Head - icosahedron
        const headGeo = new THREE.IcosahedronGeometry(0.7, 1);
        const head = new THREE.Mesh(headGeo, bodyMat);
        head.position.set(0, 2.2, 0);
        cat.add(head);

        // Head wireframe
        const headWire = new THREE.Mesh(headGeo.clone(), wireMat);
        headWire.position.copy(head.position);
        cat.add(headWire);

        // Ears - tetrahedrons
        const earGeo = new THREE.TetrahedronGeometry(0.35);
        const leftEar = new THREE.Mesh(earGeo, accentMat);
        leftEar.position.set(-0.4, 2.85, 0);
        leftEar.rotation.set(0, 0, -0.2);
        cat.add(leftEar);

        const rightEar = new THREE.Mesh(earGeo.clone(), accentMat);
        rightEar.position.set(0.4, 2.85, 0);
        rightEar.rotation.set(0, 0, 0.2);
        cat.add(rightEar);

        // Eyes - octahedrons
        const eyeGeo = new THREE.OctahedronGeometry(0.12);
        const leftEye = new THREE.Mesh(eyeGeo, eyeMat);
        leftEye.position.set(-0.25, 2.3, 0.55);
        cat.add(leftEye);

        const rightEye = new THREE.Mesh(eyeGeo.clone(), eyeMat);
        rightEye.position.set(0.25, 2.3, 0.55);
        cat.add(rightEye);

        // Nose - small tetrahedron
        const noseGeo = new THREE.TetrahedronGeometry(0.08);
        const nose = new THREE.Mesh(noseGeo, noseMat);
        nose.position.set(0, 2.1, 0.65);
        nose.rotation.x = 0.3;
        cat.add(nose);

        // Legs - cylinders with low segments (geometric look)
        const legGeo = new THREE.CylinderGeometry(0.12, 0.15, 0.8, 5);
        const legPositions = [
            [-0.4, 0.4, 0.25],
            [0.4, 0.4, 0.25],
            [-0.35, 0.4, -0.25],
            [0.35, 0.4, -0.25]
        ];
        legPositions.forEach(pos => {
            const leg = new THREE.Mesh(legGeo, bodyMat);
            leg.position.set(...pos);
            cat.add(leg);
        });

        // Tail - series of small octahedrons in a curve
        const tailSegments = 8;
        for (let i = 0; i < tailSegments; i++) {
            const t = i / tailSegments;
            const tailGeo = new THREE.OctahedronGeometry(0.08 - t * 0.03);
            const tailPiece = new THREE.Mesh(tailGeo, i % 2 === 0 ? bodyMat : accentMat);
            tailPiece.position.set(
                0,
                1.0 + Math.sin(t * 2.5) * 0.8,
                -0.6 - t * 1.2
            );
            cat.add(tailPiece);
        }

        scene.add(cat);

        // Floor
        const floorGeo = new THREE.PlaneGeometry(20, 20);
        const floorMat = new THREE.MeshPhongMaterial({ color: 0x111111 });
        const floor = new THREE.Mesh(floorGeo, floorMat);
        floor.rotation.x = -Math.PI / 2;
        floor.position.y = 0;
        scene.add(floor);

        // Lighting
        const topLight = new THREE.DirectionalLight(0xffffff, 1.0);
        topLight.position.set(0, 8, 2);
        scene.add(topLight);

        const fillLight = new THREE.DirectionalLight(0xd4a84b, 0.4);
        fillLight.position.set(-3, 3, 4);
        scene.add(fillLight);

        const ambient = new THREE.AmbientLight(0x222222, 1.0);
        scene.add(ambient);

        // Floating particles
        const particleCount = 100;
        const particleGeo = new THREE.BufferGeometry();
        const positions = new Float32Array(particleCount * 3);
        for (let i = 0; i < particleCount; i++) {
            positions[i * 3] = (Math.random() - 0.5) * 8;
            positions[i * 3 + 1] = Math.random() * 5;
            positions[i * 3 + 2] = (Math.random() - 0.5) * 8;
        }
        particleGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        const particleMat = new THREE.PointsMaterial({
            color: 0xd4a84b,
            size: 0.03,
            transparent: true,
            opacity: 0.5,
            blending: THREE.AdditiveBlending
        });
        const particles = new THREE.Points(particleGeo, particleMat);
        scene.add(particles);

        // Animation
        let time = 0;
        function animate() {
            requestAnimationFrame(animate);
            time += 0.01;

            // Slow rotation
            cat.rotation.y = Math.sin(time * 0.3) * 0.4;

            // Breathing (subtle scale pulse on body)
            const breathe = 1 + Math.sin(time * 2) * 0.02;
            body.scale.set(breathe, breathe, breathe);
            bodyWire.scale.set(breathe, breathe, breathe);

            // Eye glow pulse
            eyeMat.emissiveIntensity = 0.5 + Math.sin(time * 3) * 0.3;

            // Tail wag
            for (let i = 0; i < tailSegments; i++) {
                const tailPiece = cat.children[cat.children.length - tailSegments + i - 4]; // offset for legs
            }

            // Particles drift
            const pos = particleGeo.attributes.position.array;
            for (let i = 0; i < particleCount; i++) {
                pos[i * 3 + 1] -= 0.003;
                if (pos[i * 3 + 1] < 0) pos[i * 3 + 1] = 5;
            }
            particleGeo.attributes.position.needsUpdate = true;

            renderer.render(scene, camera);
        }

        animate();

        // Resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // Click for eye flash
        window.addEventListener('pointerdown', () => {
            eyeMat.emissive.set(0xffffff);
            setTimeout(() => eyeMat.emissive.set(0x22aa44), 300);
        });
    </script>
</body>
</html>
